<text x="170.0" y="253" class="body" text-anchor="middle">16 entries</text>
<text x="170.0" y="279" class="body" text-anchor="middle">Read/write + address</text>
<text x="170.0" y="305" class="body" text-anchor="middle">Ready/valid input</text>
<rect x="355" y="190" width="380" height="210" rx="8" fill="#fff0d7" stroke="#526c82" stroke-width="1.7"/>
<text x="545.0" y="221" class="head" text-anchor="middle">Read coalescer</text>
<text x="545.0" y="253" class="body" text-anchor="middle">Collect contiguous 64-byte beats</text>
<text x="545.0" y="279" class="body" text-anchor="middle">At most 16 beats / 1 KiB</text>
<text x="545.0" y="305" class="body" text-anchor="middle">Split at 4 KiB or discontinuity</text>
<text x="545.0" y="331" class="body" text-anchor="middle">Flush at direction/credit limit</text>
<text x="545.0" y="357" class="body" text-anchor="middle">Flush after 4 idle cycles</text>
<rect x="805" y="190" width="260" height="210" rx="8" fill="#fff0d7" stroke="#526c82" stroke-width="1.7"/>
<text x="935.0" y="221" class="head" text-anchor="middle">Pending AXI request</text>
<text x="935.0" y="253" class="body" text-anchor="middle">Address + length registers</text>
<text x="935.0" y="279" class="body" text-anchor="middle">ARLEN = beat count − 1</text>
<text x="935.0" y="305" class="body" text-anchor="middle">Hold stable until ARREADY</text>
<text x="935.0" y="331" class="body" text-anchor="middle">One ordered AXI ID</text>
<rect x="1135" y="190" width="290" height="210" rx="8" fill="#e3f4ee" stroke="#526c82" stroke-width="1.7"/>
<text x="1280.0" y="221" class="head" text-anchor="middle">Memory fabric</text>
<text x="1280.0" y="253" class="body" text-anchor="middle">Core / host arbitration</text>
<text x="1280.0" y="279" class="body" text-anchor="middle">512 → 256-bit conversion</text>
<text x="1280.0" y="305" class="body" text-anchor="middle">AXI3 burst splitting</text>
<text x="1280.0" y="331" class="body" text-anchor="middle">HBM ports 0 / 4</text>
<polyline points="285,265 355,265" fill="none" stroke="#344f68" stroke-width="2" marker-end="url(#a)"/>
<text x="320" y="246" class="small" text-anchor="middle">read</text>
