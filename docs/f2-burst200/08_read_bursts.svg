<text x="200.0" y="564" class="body" text-anchor="middle">Collected + issued reads</text>
<text x="200.0" y="590" class="body" text-anchor="middle">Return one credit per R beat</text>
<rect x="420" y="475" width="315" height="135" rx="8" fill="#edf3f8" stroke="#526c82" stroke-width="1.7"/>
<text x="577.5" y="506" class="head" text-anchor="middle">Response checker</text>
<text x="577.5" y="538" class="body" text-anchor="middle">Ordered burst-length tracking</text>
<text x="577.5" y="564" class="body" text-anchor="middle">Check RLAST and RRESP</text>
<text x="577.5" y="590" class="body" text-anchor="middle">Latch protocol errors</text>
<rect x="805" y="475" width="260" height="135" rx="8" fill="#edf3f8" stroke="#526c82" stroke-width="1.7"/>
