<text x="770" y="526" class="small" text-anchor="middle">length</text>
<polyline points="345,505 375,505 375,440 545,440 545,400" fill="none" stroke="#344f68" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/>
<text x="390" y="430" class="small" text-anchor="start">available credits</text>
<polyline points="1280,400 1280,680 55,680" fill="none" stroke="#344f68" stroke-width="2" marker-end="url(#a)"/>
<text x="800" y="666" class="small" text-anchor="start">R channel → native response: 512-bit data, one valid pulse per beat</text>
<text x="55" y="714" class="small" text-anchor="start">Native consumer reserves response storage; RREADY stays asserted outside reset.</text>
<polyline points="575,680 575,610" fill="none" stroke="#344f68" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/>
<polyline points="200,680 200,610" fill="none" stroke="#344f68" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/>
<rect x="55" y="760" width="1370" height="120" rx="8" fill="#f2eaff" stroke="#526c82" stroke-width="1.7"/>
<text x="740.0" y="791" class="head" text-anchor="middle">Write path and direction barrier</text>
<text x="740.0" y="823" class="body" text-anchor="middle">Write-data FIFO → independent AW / W handshakes → B response increments n_wdone.</text>
<text x="740.0" y="849" class="body" text-anchor="middle">Reads begin only after older writes complete; writes begin only after all collected and issued reads return.</text>
<text x="55" y="922" class="small" text-anchor="start">Unchanged compute RTL · E71 direct weight streams: 23.54–23.87 GB/s · Core / TMEM / HBM AXI: 200 / 400 / 450 MHz.</text>
