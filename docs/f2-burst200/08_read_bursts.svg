<text x="55" y="48" class="title" text-anchor="start">HBM read bursts • preserve native ordering, reduce transaction overhead</text>
<text x="55" y="82" class="body" text-anchor="start">Adapter per native channel · E47/E48 simulation, E64 timing and E71 hardware tests pass</text>
<text x="55" y="111" class="small" text-anchor="start">200 MHz native side · 512-bit AXI4 → vendor CDC / width conversion → 450 MHz, 256-bit HBM AXI3</text>
<rect x="55" y="190" width="230" height="170" rx="8" fill="#edf3f8" stroke="#526c82" stroke-width="1.7"/>
