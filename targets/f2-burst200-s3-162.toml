# Three openTPU slices on Alex's burst200 fabric at a 162.5 MHz core (325 MHz TMEM): the
# f2-burst200-s3 target (docs/v4/f2-burst200-s3.md) with only the core clock changed, the
# hedge below f2-burst200-s3-175. Build 10 (175 MHz) routed at -0.277 ns on the same
# intra-slice core paths as build 8's 200 MHz (-0.436): the placer spends most of a longer
# period, so each step down buys only part of itself. 6.154 ns is 0.44 ns over 175's 5.714;
# exact from the shell's 250 MHz as 250 x 26 / 5 = 1300 MHz / 8 (TMEM 1300 / 4). The top in
# rtl/boards/f2/burst200-s3-162 is the s3 generator's with CORE_KHZ 162500; the clocks stage
# reads the core clock from the target (boards/f2/burst200/scripts/create_clocks.tcl).
[target]
name = "f2-burst200-s3-162"
kind = "fpga"
platform_id = 3
description = "AWS F2 VU47P: Small Shell, HBM, three openTPU m4 slices on six HBM ports (burst200 fabric), 162.5 MHz core"
[arch]
S = 3
D = 128
MCOLS = 4
ACT_BLOCKS = 128
ACT_ROWS = 16
TMEM_WORDS = 65536
IMEM_WORDS = 32768
DRAM_BYTES = 4294967296         # per slice: its two 2 GiB windows
LANES = 8
PAIR = true
DSTEP = true
STREAM = true
SEQ_WC = true
T2 = false
[uarch]
MXU_IMPL = 2
MXU_CL = 16
MXU_E = 4
VPU_CL = 2
ULANES = 8
TMEM_IMPL = 3
TMEM_NSB = 2
TMEM_RPL = true
TMEM_TDP = true
TMEM_GST = true
TMEM_PMP = 1
RPB = 0
WPB = 1
WIN = 16
FIFO_DEPTH = 1024
TRACE_DEPTH = 16384
PQ_WIN = 1024
CHASH = true
[tech]
family = "xilinxus"
part = "xcvu47p-fsvh2892-2-e"
vendor = "xilinx"
[platform]
board = "f2"
rtl_board = "f2-burst200-s3-162"  # opentpu.target.sources: core + shell only; the flow reads its
                                #   top from rtl/boards/f2/burst200-s3-162 and the adapters from
                                #   rtl/boards/f2/burst200 (boards/f2/burst200/build.py)
core_mhz = 162.5                # 6.154 ns: 0.44 ns over the 175 MHz target (build 10 routed at -0.277)
mem = "hbm"
mem_ctrl = "amd_hbm"
hostcal = false
channels_per_slice = 2
channel_bytes = 2147483648
hbm_ports = [0, 4, 8, 12, 16, 20]   # window j (slice j // 2, channel j % 2) on this HBM AXI port
floorplan = "floorplan_s3.tcl"      # boards/f2/burst200/constraints/: one pblock per SLR
beat_bytes = 64
host = "pcie"
pcie_gen = 4
pcie_lanes = 8
