# Three openTPU slices on Alex's burst200 fabric (docs/v4/f2-burst200-s3.md): the f2-burst200
# target's arch at S = 3, one slice per SLR of the VU47P, each slice on its own pair of 2 GiB
# HBM windows behind its own f2_mem SmartConnect (3 SI x 2 MI, Alex's), six HBM ports in all
# (hbm_ports: window j = 2 s + c of slice s's channel c on port hbm_ports[j]; ports 4k sit at
# the head of the 2 GiB window k x 2 GiB they serve, rack 0 = ports 0-15, rack 1 = 16-31).
# Gemma 3 1B is split over the three slices by gemma4.split_rows / split_ranges (the 4 query
# heads, the 256 K / V rows and the 2^18-row head do not divide by 3). The uarch, the clocks and
# the flow are f2-burst200's: boards/f2/burst200/build.py --target targets/f2-burst200-s3.toml.

[target]
name = "f2-burst200-s3"
kind = "fpga"
platform_id = 3
description = "AWS F2 VU47P: Small Shell, HBM, three openTPU m4 slices on six HBM ports (burst200 fabric)"
[arch]
S = 3
D = 128
MCOLS = 4
ACT_BLOCKS = 128
ACT_ROWS = 16
TMEM_WORDS = 65536
IMEM_WORDS = 32768
DRAM_BYTES = 4294967296         # per slice: its two 2 GiB windows
LANES = 8
PAIR = true
DSTEP = true
STREAM = true
SEQ_WC = true
T2 = false
[uarch]
MXU_IMPL = 2
MXU_CL = 16
MXU_E = 4
VPU_CL = 2
ULANES = 8
TMEM_IMPL = 3
TMEM_NSB = 2
TMEM_RPL = true
TMEM_TDP = true
TMEM_GST = true
TMEM_PMP = 1
RPB = 0
WPB = 1
WIN = 16
FIFO_DEPTH = 1024
TRACE_DEPTH = 16384
PQ_WIN = 1024
CHASH = true
[tech]
family = "xilinxus"
part = "xcvu47p-fsvh2892-2-e"
vendor = "xilinx"
[platform]
board = "f2"
rtl_board = "f2-burst200-s3"    # opentpu.target.sources: core + shell only; the flow reads its
                                #   top from rtl/boards/f2/burst200-s3 and the adapters from
                                #   rtl/boards/f2/burst200 (boards/f2/burst200/build.py)
core_mhz = 200.0
mem = "hbm"
mem_ctrl = "amd_hbm"
hostcal = false
channels_per_slice = 2
channel_bytes = 2147483648
hbm_ports = [0, 4, 8, 12, 16, 20]   # window j (slice j // 2, channel j % 2) on this HBM AXI port
floorplan = "floorplan_s3.tcl"      # boards/f2/burst200/constraints/: one pblock per SLR
beat_bytes = 64
host = "pcie"
pcie_gen = 4
pcie_lanes = 8
