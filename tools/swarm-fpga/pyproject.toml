[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmfpga"
version = "0.1.0"
description = "Minimal explicit decoder training and inference with an F2 integration contract"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["swarmfpga*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
