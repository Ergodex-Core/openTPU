input_features:
  - {name: tokens, type: token_ids}
output_features:
  - {name: next_token, type: token_ids}
model:
  type: causal_lm
  vocab_size: 16
  context: 32
  width: 16
  layers: 1
  heads: 2
  ff_width: 32
trainer:
  learning_rate: 0.1
  batch_size: 2
  sequence_length: 8
  steps: 100
  seed: 7
backend:
  type: reference
